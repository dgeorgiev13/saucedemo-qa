# Default test configuration.
# Every key can be overridden by a JVM system property (-Dbase.url=...)
# or an environment variable in UPPER_SNAKE_CASE (BASE_URL=...).

base.url=https://www.saucedemo.com

# chromium | firefox | webkit
browser=chromium
headless=true
slow.mo=0
default.timeout.ms=10000

# Username on the login page that identifies the "standard" user.
credentials.standard.user.prefix=standard

# Where traces and screenshots of failed tests are stored.
artifacts.dir=target/test-artifacts
