# Every key can be overridden by a system property (-Dheadless=false)
# or an environment variable in UPPER_SNAKE_CASE (HEADLESS=false).

base.url=https://www.saucedemo.com

# chromium | firefox | webkit
browser=chromium
headless=true
slow.mo=0

# The standard user is the published username that starts with this prefix.
credentials.standard.user.prefix=standard
